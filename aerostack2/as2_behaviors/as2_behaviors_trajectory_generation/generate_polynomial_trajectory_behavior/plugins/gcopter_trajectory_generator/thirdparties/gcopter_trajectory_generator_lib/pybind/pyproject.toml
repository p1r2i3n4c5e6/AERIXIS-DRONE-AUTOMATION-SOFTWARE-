[build-system]
requires = ["scikit-build-core[pyproject]"]
build-backend = "scikit_build_core.build"

[project]
name = "gcopterpy"
version = "0.1.0"
authors = [{ name = "Rafael Perez-Segui", email = "r.psegui@upm.es" }]
description = "Python bindings for gcopter_lib (GCOPTER polynomial trajectory optimiser)"
license = { text = "BSD-3-Clause" }
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.22",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.scikit-build]
cmake.minimum-version = "3.5"
cmake.build-type = "Release"
build-dir = "build"
wheel.packages = []
sdist.include = ["include/**", "src/**", "python/**", "CMakeLists.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
